<!DOCTYPE html>

<head>
<script>
// 账号：1，密码：QQ3421905552
(function(){
    const correctUser = "1";
    const correctPwd = "QQ3421905552";
    const loginStr = prompt("请输入账号|密码，使用|分隔（例：1|QQ3421905552）");
    if(!loginStr){
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px'>未输入账号密码，禁止访问</h2>";
        throw new Error("access deny");
    }
    const arr = loginStr.split("|");
    const u = (arr[0]||"").trim();
    const p = (arr[1]||"").trim();
    if(u!==correctUser || p!==correctPwd){
        document.body.innerHTML = "<h2 style='text-align:center;margin-top:40px'>账号或密码错误，禁止访问</h2>";
        throw new Error("access deny");
    }
})();
</script>

  -webkit-backdrop-filter: blur(var(--blur));

  overflow: hidden;
}

  content: "🔍";

@keyframes slideDown{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.filter-hint-btn {
  padding: 8px 18px;
  border-radius: var(--radius-full);
  border: 2px solid var(--accent);
  background: #fff;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
  transition: all var(--transition);
}

.filter-hint-btn:hover { background: var(--accent); color: #fff; }

.recent-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  margin: 8px 16px;
  background: rgba(255,255,255,0.7);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 15px;
}
.recent-back-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  font-family: inherit;
  transition: all 0.2s ease;
}
.recent-back-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

/* ===== 游戏列表 ===== */
.game-list {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  min-height: 300px;
  align-items: stretch;
}

@media (max-width: 1100px) {
  .game-list { grid-template-columns: 1fr 1fr; gap: 10px; }
}

@media (max-width: 700px) {
  .game-list { grid-template-columns: 1fr; }
}

/* 大屏等比例放大卡片 */
@media (min-width: 1400px) {
  .game-list { gap: 16px; }
  .card-h { padding: 20px 22px; min-height: 64px; }
  .ct { font-size: 18px; }
  .card-meta { gap: 8px; }
  .card-meta .disk-badge { font-size: 12px; padding: 3px 8px; }
  .card-meta .lib-num { font-size: 12px; }
}

@media (min-width: 1600px) {
  .game-list { gap: 22px; }
  .card-h { padding: 24px 28px; min-height: 74px; }
  .ct { font-size: 20px; }
  .card-meta { gap: 10px; }
  .card-meta .disk-badge { font-size: 13px; padding: 4px 10px; }
  .card-meta .lib-num { font-size: 13px; }
  .card { border-radius: 1.1rem; }
}

@media (min-width: 1920px) {
  .game-list { gap: 28px; }
  .card-h { padding: 28px 34px; min-height: 84px; }
  .ct { font-size: 22px; }
  .card-meta { gap: 12px; }
  .card-meta .disk-badge { font-size: 14px; padding: 5px 12px; }
  .card-meta .lib-num { font-size: 14px; }
  .card { border-radius: 1.2rem; }
}

@media (min-width: 2200px) {
  .game-list { gap: 34px; }
  .card-h { padding: 34px 40px; min-height: 96px; }
  .ct { font-size: 24px; }
  .card-meta { gap: 14px; }
  .card-meta .disk-badge { font-size: 15px; padding: 6px 14px; }
  .card-meta .lib-num { font-size: 15px; }
  .card { border-radius: 1.3rem; }
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  overflow: hidden;
  transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
}

.card:hover {
  border-color: rgba(201, 100, 66, 0.25);
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

/* 大卡片：占满整行，显示全部文字 */
.card.big-card {
  grid-column: 1 / -1;
}

.card.big-card .ct {
  -webkit-line-clamp: unset;
  display: block;
  overflow: visible;
  min-height: auto;
}

.card.big-card .card-d {
  display: block;
}

.card.big-card .card-h {
  min-height: auto;
  cursor: default;
}

.card.big-card .card-h:hover {
  background: transparent;
}

.pin-card {
  background: rgba(255, 248, 240, 0.7);
  border-left: 3px solid var(--accent);
}

.pin-card .card-h .ct { color: #B0562F; }

.card-h {
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  min-height: 54px;
  transition: background var(--transition);
}

.card-h:hover { background: rgba(201, 100, 66, 0.04); }

.card-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  white-space: nowrap;
}

.card-meta .disk-badge {
  font-size: 10px;
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
  white-space: nowrap;
}

.card-meta .lib-num {
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  white-space: nowrap;
}

.ct {
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
  min-width: 0;
  word-break: break-all;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  min-height: 2.6em;
}

.ct em {
  font-style: normal;
  color: var(--danger);
  background: rgba(214, 69, 69, 0.1);
  padding: 0 3px;
  border-radius: 3px;
  font-weight: 700;
}

.card-d {
  padding: 0 16px 14px;
  display: none;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}

.fg { margin-bottom: 5px; display: flex; gap: 6px; }
.fg:last-child { margin-bottom: 0; }

.fl {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 64px;
  padding-top: 1px;
}

.fv {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
  word-break: break-all;
  white-space: pre-wrap;
}

.fv a { color: var(--accent); text-decoration: none; font-weight: 500; }
.fv a:hover { text-decoration: underline; }
.fv em { font-style: normal; color: var(--danger); background: rgba(214, 69, 69, 0.1); padding: 0 2px; border-radius: 2px; }

/* ===== 空状态 ===== */
.empty-hint {
  grid-column: 1 / -1;
  max-width: 500px;
  justify-self: center;
  width: 100%;
  background: var(--bg-card);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  text-align: center;
  margin-top: 10px;
}

.empty-hint-icon { font-size: 36px; display: block; margin-bottom: 12px; }
.empty-hint-title { font-size: 16px; font-weight: 700; color: var(--warning); margin-bottom: 8px; }
.empty-hint-desc { font-size: 13px; color: #B45309; margin-bottom: 12px; line-height: 1.6; }
.empty-hint-sub { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.5; }

/* ===== 加载状态 ===== */
.loading { text-align: center; padding: 120px 20px; color: var(--text-secondary); font-size: 15px; grid-column: 1 / -1; }

.loading-spinner {
  display: block;
  width: 56px;
  height: 56px;
  margin: 0 auto 24px;
  border: 5px solid var(--border-solid);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.loading-title { font-size: 20px; font-weight: 700; color: var(--text); margin: 0 0 8px; }
.loading-sub { font-size: 15px; color: var(--text-muted); margin: 0; }

.loading-bar-wrap {
  max-width: 360px;
  height: 6px;
  background: #e0e0e0;
  border-radius: 3px;
  margin: 12px auto 0;
  overflow: hidden;
}

.loading-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .5s ease-out;
}

@keyframes spin{to{transform:rotate(360deg)}}
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }

/* ===== 图片弹窗 ===== */
.img-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(40, 38, 27, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 200;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.img-modal.show { display: flex; }

.img-modal-close {
  position: absolute;
  top: 16px; right: 20px;
  font-size: 32px;
  color: #fff;
  cursor: pointer;
  z-index: 1;
  line-height: 1;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.15);
  border-radius: 50%;
  transition: background var(--transition);
}

.img-modal-close:hover { background: rgba(255,255,255,.3); }

.img-modal-box {
  max-width: 90vw;
  max-height: 85vh;
  overflow: auto;
  border-radius: var(--radius);
  background: var(--bg-glass-strong);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  padding: 8px;
}

.img-modal-box img { max-width: 100%; height: auto; display: block; border-radius: var(--radius-sm); }
.img-modal-err { color: var(--text); text-align: center; font-size: 15px; padding: 40px; }

/* ===== 群信息弹窗 ===== */
.group-modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(40, 38, 27, 0.5);
  backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
  z-index: 9999;
}
.group-modal-overlay.show {
  display: flex;
  animation: groupOverlayIn .2s ease;
}
@keyframes groupOverlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.group-modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px 28px 24px;
  max-width: 380px; width: 90%;
  text-align: center;
  position: relative;
  box-shadow: var(--shadow);
  backdrop-filter: blur(var(--blur));
  border: 1px solid var(--border);
  animation: groupModalIn .28s ease;
}
@keyframes groupModalIn {
  from { opacity: 0; transform: translateY(20px) scale(.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.group-modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none; font-size: 22px;
  color: var(--accent); cursor: pointer;
  line-height: 1; padding: 0;
}
.group-modal-close:hover { color: var(--text); }
.group-modal-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px; text-align: left;
}
.group-modal-avatar {
  width: 60px; height: 60px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0;
  border: 2px solid var(--border);
}
.group-modal-info { flex: 1; min-width: 0; }
.group-modal-name {
  font-size: 16px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 4px;
}
.group-modal-number {
  font-size: 13px; color: var(--text-muted);
  font-family: "Geist Mono", "Consolas", monospace;
}
.group-modal-join {
  display: block; width: 100%; height: 46px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 16px; font-weight: 600; cursor: pointer;
  font-family: var(--font);
  margin-bottom: 16px;
  transition: var(--transition);
}
.group-modal-join:hover { background: #b3573a; }
.group-modal-desc {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.7; white-space: pre-line;
  text-align: left;
  padding: 12px 16px;
  background: rgba(0,0,0,0.03);
  border-radius: var(--radius-sm);
}

/* ===== 下载弹窗 ===== */
.dl-modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(40, 38, 27, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 150;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.dl-modal-overlay.show { display: flex; }

.dl-modal {
  background: var(--bg-glass-strong);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  padding: 28px 24px 24px;
  max-width: 400px;
  width: 90vw;
  text-align: center;
  position: relative;
  animation: dlModalIn .25s ease;
}

@keyframes dlModalIn {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.dl-modal-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.3;
  word-break: break-all;
}

.dl-modal-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
  font-size: 12px;
}

.dl-modal-meta .disk-badge {
  font-size: 11px;
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 600;
}

.dl-modal-meta .lib-num {
  color: var(--text-muted);
  font-weight: 500;
}

.dl-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 40px;
  border-radius: var(--radius);
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s;
  width: 100%;
  box-shadow: 0 4px 16px rgba(201, 100, 66, .35);
}

.dl-btn:hover {
  background: #B0562F;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(201, 100, 66, .45);
}

.dl-btn:active { transform: translateY(0); }

.dl-modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 20px;
  cursor: pointer;
  transition: all .2s;
}

.dl-modal-close:hover { background: rgba(0,0,0,.06); color: var(--text); }

.dl-modal-extras {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  text-align: left;
}

.dl-modal-extras-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 6px;
  font-size: 13px;
  line-height: 1.5;
}

.dl-modal-extras-item:last-child { margin-bottom: 0; }

.dl-modal-extras-label {
  font-weight: 700;
  flex-shrink: 0;
  font-size: 12px;
  white-space: nowrap;
}

.dl-modal-extras-item.fallback {
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.2);
}

.dl-modal-extras-item.fallback .dl-modal-extras-label {
  color: #b45309;
}

.dl-modal-extras-item.fallback .dl-modal-extras-val {
  color: #92400e;
  word-break: break-all;
}

.dl-modal-extras-item.bonus {
  background: rgba(201, 100, 66, 0.06);
  border: 1px solid rgba(201, 100, 66, 0.15);
}

.dl-modal-extras-item.bonus .dl-modal-extras-label {
  color: var(--accent);
}

.dl-modal-extras-item.bonus .dl-modal-extras-val {
  color: var(--text-secondary);
  word-break: break-all;
}

.dl-modal-extras-val {
  flex: 1;
  min-width: 0;
  color: var(--text-secondary);
}

/* ===== 版本号badge ===== */
#clientVerBadge {
  font-size: 11px;
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 10px;
  display: none;
  vertical-align: middle;
  margin-left: 6px;
  font-weight: 500;
}
/* 移动端顶部导航 - 默认隐藏，移动端显示 */
.top-nav-mobile {
  display: none;
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 249, 245, 0.78);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(218, 217, 212, 0.45);
  padding: 12px 16px;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
}
.top-nav-mobile h1 {
  font-size: 16px;
  font-weight: 700;
  color: #3D3929;
  letter-spacing: -0.01em;
}
.top-nav-mobile-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.top-nav-mobile-btn {
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid rgba(218, 217, 212, 0.45);
  background: rgba(255,255,255,0.58);
  color: #6E6D68;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.top-nav-mobile-btn:hover {
  border-color: #C96442;
  color: #C96442;
  background: rgba(201,100,66,0.08);
}
/* ===== 移动端横向滑动筛选栏 ===== */
.filter-scroll {
  display: none;
  gap: 6px;
  overflow-x: auto;
  padding: 6px 16px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
  justify-content: flex-start;
  background: rgba(250, 249, 245, 0.72);
}
.filter-scroll::-webkit-scrollbar { display: none; }
.filter-scroll-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
  flex: 0 0 auto;
  align-self: center;
  padding-right: 4px;
  letter-spacing: 0.02em;
}
/* 移动端 sfb 按钮样式 */
.filter-scroll .sfb {
  flex: 0 0 auto;
  padding: 7px 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: var(--bg-glass-strong);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  font-weight: 500;
  transition: all 0.2s ease;
}
.filter-scroll .sfb:active { transform: scale(0.96); }
.filter-scroll .sfb.act {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.filter-scroll .sfb-recent {
  color: var(--danger);
  border-color: rgba(214, 69, 69, 0.3);
  background: rgba(214, 69, 69, 0.04);
  font-weight: 600;
}
.filter-scroll .sfb-recent.act {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  box-shadow: 0 2px 12px rgba(214, 69, 69, 0.3);
}
.filter-scroll .sfb-recent3 {
  color: #7c3aed;
  border-color: rgba(124, 58, 237, 0.3);
  background: rgba(124, 58, 237, 0.04);
  font-weight: 600;
}
.filter-scroll .sfb-recent3.act {
  background: #7c3aed;
  color: #fff;
  border-color: #7c3aed;
  box-shadow: 0 2px 12px rgba(124, 58, 237, 0.3);
}
.filter-scroll .sfb-popular {
  color: #7c3aed;
  border-color: rgba(124, 58, 237, 0.3);
  background: rgba(124, 58, 237, 0.04);
  font-weight: 600;
}
.filter-scroll .sfb-popular.act {
  background: #7c3aed;
  color: #fff;
  border-color: #7c3aed;
  box-shadow: 0 2px 12px rgba(124, 58, 237, 0.3);
}
.filter-scroll .sfb-qq-m {
  color: #12B7F5 !important;
  border-color: #12B7F5 !important;
  background: rgba(18, 183, 245, 0.06) !important;
  font-weight: 600;
}
.filter-scroll .sfb-qq-m:active { background: rgba(18, 183, 245, 0.15) !important; }
.filter-scroll .sfb-vip-m {
  color: #c78500 !important;
  border-color: #f0a500 !important;
  background: rgba(240, 165, 0, 0.06) !important;
  font-weight: 600;
}
.filter-scroll .sfb-vip-m:active { background: rgba(240, 165, 0, 0.15) !important; }
/* 移动端工具栏（充电/零花钱按钮，在系统筛选上方） */
.mobile-toolbar {
  display: none;
  padding: 8px 16px 12px;
  gap: 8px;
  justify-content: flex-start;
}
.mobile-toolbar .bbtn {
  width: auto;
  flex: 1;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: none;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  font-weight: 600;
  transition: all var(--transition);
}
.mobile-toolbar .bbtn-charge {
  background: linear-gradient(135deg, #C96442, #D6866A);
}
.mobile-toolbar .bbtn-earn {
  background: linear-gradient(135deg, #11998e, #38ef7d);
  color: #003d33;
}
.mobile-toolbar .bbtn:active { transform: scale(0.97); }
/* 移动端进度条 */
.mobile-progress {

var G=[], allG=[], curSub="all", curDisk="all", curDLib="all", curRecent=false, curPopular=false, pinnedSet={}, recentSet={}, _pinnedCount=0, _mlMap={};
var DISK_LIBS={xunlei:['迅雷1号库','迅雷2号库','迅雷3号库'],quark:['夸克1号库','夸克2号库','夸克3号库'],uc:['UC1号库','UC2号库','UC3号库'],baidu:['百度1号库','百度2号库','百度3号库']};
var RENDER_CHUNK=40, renderIndex=0, renderTimer=null;
var SERVER="http://47.236.169.249";
var SERVER_DEFAULT="http://47.236.169.249";
var CONFIG_URL="https://gitee.com/zaoshuiyidiandian/tangs-complete-library/raw/master/config.json";
var _failCount=0;

function getServer(){ return SERVER }
function saveServer(url){ SERVER=url; try{localStorage.setItem("_srv",url)}catch(e){} }
function initServer(){
  var saved=null;
  try{saved=localStorage.getItem("_srv")}catch(e){}
  if(saved && saved.indexOf("http")===0){ SERVER=saved }
  else{ SERVER=SERVER_DEFAULT }
}
function onFetchFail(){
  _failCount++;
  if(_failCount>=3 && SERVER!==SERVER_DEFAULT){ saveServer(SERVER_DEFAULT); _failCount=0; }
}
function onFetchOk(){ _failCount=0 }
function checkRemoteConfig(){
  var x=new XMLHttpRequest();
  x.open("GET",CONFIG_URL+"?t="+Date.now(),true);
  x.timeout=8000;
  x.onload=function(){
    if(x.status===200)try{
      var cfg=JSON.parse(x.responseText);
      if(cfg.server && cfg.server!==SERVER){ saveServer(cfg.server); SERVER=cfg.server; loadData(); }
    }catch(e){}
  };
  x.send();
}
function openDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open("xlsDB",1);
    req.onupgradeneeded=function(e){ var db=e.target.result; if(!db.objectStoreNames.contains("data")) db.createObjectStore("data"); };
    req.onsuccess=function(e){resolve(e.target.result)};
    req.onerror=function(e){reject(e)};
  });
}
function dbGet(key){
  return openDB().then(function(db){
    return new Promise(function(resolve){
      var tx=db.transaction("data","readonly");
      var req=tx.objectStore("data").get(key);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(){resolve(null)};
    });
  });
}
function dbSet(key,val){
  return openDB().then(function(db){
    return new Promise(function(resolve){
      var tx=db.transaction("data","readwrite");
      tx.objectStore("data").put(val,key);
      tx.oncomplete=function(){resolve()};
    });
  });
}

<script>
async function gunzip(buffer){
  if(typeof DecompressionStream!=="undefined"){
    try{
      var ds=new DecompressionStream("gzip");
      var writer=ds.writable.getWriter();
      writer.write(buffer); writer.close();
      var result=await new Response(ds.readable).arrayBuffer();
      return new Uint8Array(result);
    }catch(e){}
  }
  if(typeof pako!=="undefined" && pako.ungzip){ return pako.ungzip(new Uint8Array(buffer)); }
  throw new Error("无法解压数据");
}
async function loadData(){
  initServer();
  var cached=await dbGet("games");
  var cachedVer=await dbGet("version");
  if(cached&&cached.length>0){
    allG=cached;
    _lastServerTime=(typeof cachedVer==="string")?cachedVer:"";
    initDone();
    // 使用 sessionStorage 标记：只有首次加载或手动触发才进行静默刷新
    // 从其他页面返回时不触发静默刷新，避免出现加载状态
    if(sessionStorage.getItem('_dataLoaded') !== '1'){
      sessionStorage.setItem('_dataLoaded', '1');
      setTimeout(function(){silentRefreshData()},2000);
    }
  }else{
    var el=document.getElementById("list");
    el.innerHTML='<div class="loading"><span class="loading-spinner"></span><p class="loading-title">正在连接服务器...</p><p class="loading-sub">首次使用需下载游戏数据</p><div class="loading-bar-wrap"><div class="loading-bar-fill" style="width:10%"></div></div></div>';
    try{
      var verResp=await fetch(getServer()+"/update/version.json?t="+Date.now());
      if(!verResp.ok) throw new Error("服务器无响应");
      onFetchOk();
      var ver=await verResp.json();
      var serverTime=ver.updated_at||ver.updated||"";
      _lastServerTime=serverTime;
      var cv=ver.client_version||0;
      if(cv>0) localStorage.setItem("_cv",String(cv));
      updateVersionBadge();
      el.innerHTML='<div class="loading"><span class="loading-spinner"></span><p class="loading-title">正在下载数据...</p><p class="loading-sub">共 '+(ver.count||0)+' 条游戏，请耐心等待</p><div class="loading-bar-wrap"><div class="loading-bar-fill" style="width:40%"></div></div></div>';
      await downloadFullDataGz();
      await dbSet("version",serverTime);
      el.innerHTML='<div class="loading"><span class="loading-spinner"></span><p class="loading-title">数据加载完成</p><p class="loading-sub">正在渲染游戏列表...</p><div class="loading-bar-wrap"><div class="loading-bar-fill" style="width:90%"></div></div></div>';
      initDone();
    }catch(e){
      onFetchFail();
      el.innerHTML='<div class="empty" style="padding:60px 20px"><p style="font-size:18px;font-weight:700;color:#333;margin-bottom:8px">数据加载失败</p><p style="font-size:14px;color:#999;margin-bottom:16px">'+e.message+'</p><button onclick="loadData()" style="padding:10px 24px;border-radius:8px;border:none;background:#667eea;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit">重新加载</button></div>';
    }
  }
}
function mergeIncremental(incData, serverTime){
  var deletedSet={};
  if(incData.deleted_names){ for(var i=0;i<incData.deleted_names.length;i++){deletedSet[incData.deleted_names[i]]=true} }
  if(incData.deleted_names&&incData.deleted_names.length>0){ allG=allG.filter(function(g){return !deletedSet[g[0]]}); }
  var nameMap={};
  for(var i=0;i<allG.length;i++){nameMap[allG[i][0]]=i}
  if(incData.items){
    for(var i=0;i<incData.items.length;i++){
      var name=incData.items[i][0];
      var idx=nameMap[name];
      if(idx!==undefined){allG[idx]=incData.items[i]}
      else{allG.push(incData.items[i]);nameMap[name]=allG.length-1}
    }
  }
  _lastServerTime=serverTime;
  return Promise.all([dbSet("games",allG),dbSet("version",serverTime)]);
}
async function downloadFullDataGz(onProgress){
  var resp=await fetch(getServer()+"/update/data_full.gz?t="+Date.now());
  if(!resp.ok) throw new Error("下载失败");
  var total=parseInt(resp.headers.get('Content-Length'))||0;
  var reader=resp.body.getReader();
  var chunks=[];
  var received=0;
  while(true){
    var result=await reader.read();
    if(result.done) break;
    chunks.push(result.value);
    received+=result.value.length;
    if(onProgress){
      var pct=total>0?Math.round(received/total*100):Math.min(99,Math.round(received/5000));
      onProgress(pct,received,total);
    }
  }
  var allBytes=new Uint8Array(received);
  var pos=0;
  for(var i=0;i<chunks.length;i++){
    allBytes.set(chunks[i],pos);
    pos+=chunks[i].length;
  }
  var raw=await gunzip(allBytes.buffer);
  allG=JSON.parse(new TextDecoder("utf-8").decode(raw));
  await dbSet("games",allG);
}
async function downloadFullData(){
  var listEl=document.getElementById("list");
  if(listEl)listEl.innerHTML='<div class="loading">⏳ 首次加载数据中，请耐心等待...<br><small style="color:#999">正在连接服务器...</small></div>';
  var resp=await fetch(getServer()+"/update/version.json?t="+Date.now());
  if(!resp.ok) throw new Error("服务器无响应");
  onFetchOk();
  var serverVer=await resp.json();
  var serverTime=serverVer.updated_at||serverVer.updated||"";
  _lastServerTime=serverTime;
  var cv=serverVer.client_version||0;
  if(cv>0) localStorage.setItem("_cv",String(cv));
  updateVersionBadge();
  var count=serverVer.count||0;
  if(listEl)listEl.innerHTML='<div class="loading">⏳ 首次加载数据中，请耐心等待...<br><small style="color:#999">正在下载 '+count+' 条游戏数据，预计需要几秒钟<br>请勿关闭页面</small></div>';
  var dataResp=await fetch(getServer()+"/api/data_full?t="+Date.now());
  if(dataResp.ok){ allG=await dataResp.json(); await dbSet("games",allG); await dbSet("version",serverTime); if(listEl)listEl.innerHTML='<div class="loading">✅ 数据加载完成，正在渲染...</div>'; return; }
  throw new Error("无法获取数据");
}
async function silentRefreshData(){
  try{
    var verResp=await fetch(getServer()+"/update/version.json?t="+Date.now());
    if(!verResp.ok) return;
    var ver=await verResp.json();
    var serverTime=ver.updated_at||ver.updated||"";
    if(serverTime && serverTime===_lastServerTime) return;
    var cv=ver.client_version||0;
    var localCv=parseInt(localStorage.getItem("_cv")||"0");
    if(cv>0 && cv>localCv) localStorage.setItem("_cv",String(cv));

      // 非搜索时：正常应用筛选条件

      var da=a[9]||'', db=b[9]||'';

// ===== 形近字映射表 =====
var SIMILAR_CHARS = {
  '愤':'风','风':'愤',  // 用户案例：愤怒→风怒
  '日':'曰','曰':'日',
  '土':'士','士':'土',

  '刀':'力','力':'刀',
  '几':'儿','儿':'几',
  '幻':'幼','幼':'幻',
  '竞':'竟','竟':'竞',
  '梁':'粱','粱':'梁',
  '拔':'拨','拨':'拔',
  '徒':'徙','徙':'徒',
  '赏':'尝','尝':'赏',
  '钓':'钧','钧':'钓',
  '候':'侯','侯':'候',
  '刺':'剌','剌':'刺',
  '余':'佘','佘':'余',
  '采':'彩','彩':'采',
  '摹':'摩','摩':'摹',
  '茶':'荼','荼':'茶',
  '微':'徽','徽':'微',
  '概':'慨','慨':'概',
  '锥':'椎','椎':'锥',
  '盲':'肓','肓':'盲',
  '胃':'胄','胄':'胃',
  '炙':'灸','灸':'炙',
  '蓬':'篷','篷':'蓬',
  '杳':'杲','杲':'杳'
};
// 形近字归一化：将字符串中的每个字符替换为形近字（生成扩展文本）
function normalizeText(s){
  s=String(s||'');
  var r='';
  for(var i=0;i<s.length;i++){
    var c=s[i];
    r+=SIMILAR_CHARS[c]||c;
  }
  return r;
}
// 多级匹配：返回匹配优先级 1-5，0表示不匹配
function getMatchLevel(name,query){
  var n=name.toLowerCase();
  var q=query.toLowerCase();
  // 去除空格后的版本，用于容错匹配（如"特工17"匹配"特工 17"）
  var nNS=n.replace(/\s+/g,'');
  var qNS=q.replace(/\s+/g,'');
  // Level 1: 精确匹配（含去空格后精确匹配）
  if(n===q)return 1;
  if(nNS===qNS)return 1;
  // Level 2: 前缀匹配
  if(n.indexOf(q)===0)return 2;
  if(nNS.indexOf(qNS)===0)return 2;
  // Level 3: 子串匹配
  if(n.indexOf(q)!==-1)return 3;
  if(nNS.indexOf(qNS)!==-1)return 3;
  if(nNS.indexOf(q)!==-1)return 3;
  // Level 4: 形近字归一化后子串匹配
  var nNorm=normalizeText(n);
  var qNorm=normalizeText(q);
  if(nNorm.indexOf(qNorm)!==-1)return 4;
  var nNormNS=nNorm.replace(/\s+/g,'');
  if(nNormNS.indexOf(qNorm)!==-1)return 4;
  if(nNormNS.indexOf(qNS)!==-1)return 4;
  // Level 5: 多字符组合匹配 — 查询词中大部分字符出现在游戏名中
  // 统计有效字符数（跳过分隔符）和匹配数
  var validChars=0, matchedCount=0;
  for(var i=0;i<q.length;i++){
    var c=q[i];
    if(/[\s\-_.,:;!?，。、]/.test(c))continue;
    validChars++;
    if(n.indexOf(c)!==-1){ matchedCount++; continue; }
    var cNorm=SIMILAR_CHARS[c];
    if(cNorm&&n.indexOf(cNorm)!==-1){ matchedCount++; continue; }
  }
  if(validChars>=2){
    // 阈值：2字查询需100%匹配，3字需≥2，4字需≥2，5字需≥3…
    var threshold=Math.max(2, Math.ceil(validChars*0.6));
    if(matchedCount>=threshold) {
      // 返回细粒度分数：匹配越多 score 越低（越靠前）
      // 如 5.0(全匹配) ~ 5.9(刚过阈值)
      return 5 + (1 - matchedCount/validChars) * 0.9;
    }
  }
  return 0;
}

function hl(t,q,level){
  if(!q||!t)return esc(t);
  var qq=q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  var et=esc(t);
  // 1. 先尝试直接高亮整个查询词
  try{
    var re=new RegExp("("+qq+")","gi");
    if(re.test(et)) return et.replace(re,"<em>$1</em>");
  }catch(e){}
  // 2. 如果查询词包含空格，尝试去空格后高亮整个词
  if(qq.indexOf('\\s')===-1){
    var qqNS=q.replace(/\s+/g,'').replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    if(qqNS!==qq){
      try{
        var re2=new RegExp("("+qqNS+")","gi");
        if(re2.test(et)) return et.replace(re2,"<em>$1</em>");
      }catch(e){}
    }
  }
  // 3. 整词未匹配到，则逐个高亮查询词中出现在游戏名里的字符
  try{
    var chars=q.split('').filter(function(c){return c.trim()}).map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join('|');
    if(chars){
      var re3=new RegExp("("+chars+")","gi");
      return et.replace(re3,"<em>$1</em>");
    }
  }catch(e){}
  return et;
}

// ---- 近三天更新 ----
function getPvDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getPvDateLabel(d) {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var target = new Date(d);
  target.setHours(0, 0, 0, 0);
  var diff = Math.round((today - target) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff === 2) return '前天';
  return getPvDateStr(target);
}

function getPvRecentDates() {
  var dates = [];
  var now = new Date();
  for (var i = 0; i < 3; i++) {
    var d = new Date(now);
    d.setDate(d.getDate() - i);
    dates.push(getPvDateStr(d));
  }
  return dates;
}

function buildPvDateTabs() {
  var dates = getPvRecentDates();
  // 首次打开时构建缓存，只遍历一次
  _pvRecentCache = {};
  for (var i = 0; i < dates.length; i++) {
    _pvRecentCache[dates[i]] = [];
  }
  for (var i = 0; i < allG.length; i++) {
    var gameDate = (allG[i][9] || '').trim();
    if (gameDate && _pvRecentCache[gameDate] !== undefined) {
      _pvRecentCache[gameDate].push({g: allG[i], idx: i});
    }
  }
  var tabsHtml = '<div class="pv-date-tabs">';
  for (var i = 0; i < dates.length; i++) {
    var d = dates[i];
    var count = _pvRecentCache[d] ? _pvRecentCache[d].length : 0;
    var label = getPvDateLabel(d) + ' ' + d;
    tabsHtml += '<button class="pv-date-tab' + (i === 0 ? ' active' : '') + '" data-date="' + d + '" onclick="pvSelectDate(this,\'' + d + '\')">' +
      label + '<span class="count">' + count + '条</span></button>';
  }
  tabsHtml += '</div>';
  _pvCurDate = dates[0];
  var firstCount = _pvRecentCache[dates[0]] ? _pvRecentCache[dates[0]].length : 0;
  var content = document.getElementById('pageViewContent');
  content.innerHTML = tabsHtml + '<div class="pv-stats">共 ' + firstCount + ' 款游戏 · 近三天更新</div><div class="pv-game-list" id="pvGameList"></div>';
  pvRenderGames();
}

function pvSelectDate(el, date) {
  _pvCurDate = date;
  document.querySelectorAll('.pv-date-tab').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  // 更新统计文字
  var count = _pvRecentCache && _pvRecentCache[date] ? _pvRecentCache[date].length : 0;
  var stats = document.querySelector('.pv-stats');
  if (stats) stats.textContent = '共 ' + count + ' 款游戏 · 近三天更新';
  pvRenderGames();
}

function pvRenderGames() {
  var el = document.getElementById('pvGameList');
  if (!el) return;
  var filtered = _pvRecentCache && _pvRecentCache[_pvCurDate] ? _pvRecentCache[_pvCurDate] : [];
  if (filtered.length === 0) {
    el.innerHTML = '<div class="pv-empty"><div class="pv-empty-icon">📭</div><div class="pv-empty-title">该日期暂无更新</div><div class="pv-empty-desc">' + _pvCurDate + ' 没有游戏更新记录</div></div>';
    return;
  }
  var h = '';
  for (var i = 0; i < filtered.length; i++) {
    var item = filtered[i];
    var g = item.g;
    var name = esc(g[0] || '');
    var diskIcon = diskBadge(g[5] || detectClientDisk(g[1]));
    var libNum = g[8] || '';
    var metaH = '';
    if (diskIcon || libNum) {
      metaH = '<div class="pv-game-meta">' +
        (diskIcon ? '<span class="disk-badge" style="background:' + diskIcon.bg + '">' + diskIcon.label + '</span>' : '') +
        (libNum ? '<span class="lib-num">' + esc(libNum) + '</span>' : '') +
        '</div>';
    }
    h += '<div class="pv-game-item" onclick="pvShowDl(' + item.idx + ')"><div class="pv-game-name">' + name + '</div>' + metaH + '</div>';
  }
  el.innerHTML = h;

function loadPvRanking(period) {
  _pvCurPeriod = period;
  var content = document.getElementById('pageViewContent');
  content.innerHTML = pvTabBarHtml(period) +
    '<div class="pv-loading"><div class="pv-loading-spinner"></div><div class="pv-loading-title">正在加载数据...</div><div class="pv-loading-sub">请稍候</div></div>';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', getServer() + '/api/popular?period=' + period + '&limit=10&t=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        pvRenderRanking(data.games || []);
      } catch(e) {
        pvRankingError('数据解析失败');
      }
    } else {
      pvRankingError('请求失败');
    }
  };
  xhr.onerror = function() { pvRankingError('网络错误'); };
  xhr.send();
}

function pvSwitchTab(el, period) {
  document.querySelectorAll('.pv-tab-btn').forEach(function(b) { b.className = 'pv-tab-btn'; });
  el.className = 'pv-tab-btn act';
  loadPvRanking(period);
}

function pvRenderRanking(games) {
  var el = document.getElementById('pageViewContent');
  if (!games || !games.length) {
    el.innerHTML = pvTabBarHtml(_pvCurPeriod) +
      '<div class="pv-empty"><div class="pv-empty-icon">📭</div><div class="pv-empty-title">暂无数据</div><div class="pv-empty-desc">还没有游戏被点击，快去试试吧！</div></div>';
    return;
  }
  _pvRankingGames = games;
  var h = pvTabBarHtml(_pvCurPeriod);
  h += '<div class="pv-game-list">';
  for (var i = 0; i < games.length; i++) {
    var g = games[i];
    var rank = i + 1;
    var rankCls = 'pv-rank';
    if (rank === 1) rankCls += ' top1';
    else if (rank === 2) rankCls += ' top2';
    else if (rank === 3) rankCls += ' top3';

    var diskCls = 'disk-badge';
    if (g.disk === 'xunlei') diskCls += ' disk-xunlei';
    else if (g.disk === 'quark') diskCls += ' disk-quark';
    else if (g.disk === 'uc') diskCls += ' disk-uc';
    else if (g.disk === 'baidu') diskCls += ' disk-baidu';

    var diskLabel = g.disk === 'xunlei' ? '迅雷' : g.disk === 'quark' ? '夸克' : g.disk === 'uc' ? 'UC' : g.disk === 'baidu' ? '百度' : '';

    h += '<div class="pv-game-item" onclick="pvRankingDownload(' + i + ')">';
    h += '<span class="' + rankCls + '">' + rank + '</span>';
    h += '<span class="pv-game-name">' + esc(g.name) + '</span>';
    if (diskLabel) h += '<span class="' + diskCls + '">' + diskLabel + '</span>';
    h += '<span class="pv-click-count">' + g.clicks + '</span>';
    h += '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}

function pvRankingDownload(idx) {

var _lastServerTime="";
var _notifiedTime="";
var _autoCheckTimer=null;
function pollServer(){
  var _curCount = G.length;
  fetch(getServer()+"/update/version.json?t="+Date.now()).then(function(r){return r.json()}).then(function(v){
    var t=v.updated_at||v.updated||"";
    if(checkVersionAndNotify(v)) return;
    if(t&&t!==_lastServerTime&&t!==_notifiedTime){
      _notifiedTime=t;
      var notify=document.getElementById("updateNotify");
      notify.style.display="flex";
      notify.style.background="";
      notify.onclick=function(){checkUpdate()};
      var serverCount = v.count || 0;
      var diff = serverCount - _curCount;
      var diffText = '';
      if(diff > 0) diffText = '新增 ' + diff + ' 条';
      else if(diff < 0) diffText = '更新 ' + Math.abs(diff) + ' 条';
      else diffText = '数据有变化';
      document.getElementById("updateNotifyText").innerHTML="<b>📦 发现新数据</b><br><span style='font-size:12px;opacity:.9'>" + diffText + " · 更新于 "+t+"</span>";
      notify.querySelector("span:last-child").textContent="立即更新 →";
    }
  }).catch(function(){});
}
function downloadClient(cv){
  var a=document.createElement("a");
  a.href=getServer()+"/client/index.html";
  a.download="迅雷搜_唐氏全库_v"+(cv||"0")+".html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  fetch(getServer()+"/api/client-version?t="+Date.now()).then(function(r){return r.json()}).then(function(info){
    if(info.client_version) { localStorage.setItem("_cv",String(info.client_version)); localStorage.setItem("_notified_cv",String(info.client_version)); localStorage.setItem("_acted_cv",String(info.client_version)); }
    updateVersionBadge();
  }).catch(function(){
    if(cv) { localStorage.setItem("_cv",String(cv)); localStorage.setItem("_notified_cv",String(cv)); localStorage.setItem("_acted_cv",String(cv)); }
    updateVersionBadge();
  });
  document.getElementById("updateNotify").style.display="none";
}
function escHtml(s){s=String(s);return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function formatSize(bytes){
  if(bytes<1024) return bytes+'B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+'KB';
  return (bytes/(1024*1024)).toFixed(1)+'MB';
}
function startAutoCheck(){
  clearInterval(_autoCheckTimer);
  setTimeout(function(){pollServer();_autoCheckTimer=setInterval(pollServer,300000)},30000);
}

        }
      } else {
        _groupConfig.qq_group = JSON.parse(JSON.stringify(_groupConfigEmbed.qq_group));
      }
      if (_groupConfig.vip_group) {
        for (var k in _groupConfigEmbed.vip_group) {
          if (!_groupConfig.vip_group[k]) _groupConfig.vip_group[k] = _groupConfigEmbed.vip_group[k];
        }
      } else {
        _groupConfig.vip_group = JSON.parse(JSON.stringify(_groupConfigEmbed.vip_group));
      }
      updateGroupButtons();
    }
  }).catch(function() { _groupConfig = JSON.parse(JSON.stringify(_groupConfigEmbed)); updateGroupButtons(); });
}
function updateGroupButtons() {
  var cfg = _groupConfig || _groupConfigEmbed;
  var qqBtn = document.getElementById('qqGroupBtn');
  var vipBtn = document.getElementById('vipGroupBtn');
  var qqBtnM = document.getElementById('qqGroupBtnM');
  var vipBtnM = document.getElementById('vipGroupBtnM');
  var hasQQ = cfg && cfg.qq_group && cfg.qq_group.number;
  if (qqBtn) { qqBtn.style.display = hasQQ ? '' : 'none'; }
  if (qqBtnM) { qqBtnM.style.display = hasQQ ? '' : 'none'; }
  // VIP按钮始终显示，未配置时可点击进入后台配置
  if (vipBtn) { vipBtn.style.display = ''; }
  if (vipBtnM) { vipBtnM.style.display = ''; }
}
function showGroupModal(type) {
  var cfg = (_groupConfig || _groupConfigEmbed);
  if (!cfg) return;
  var g = type === 'qq' ? cfg.qq_group : cfg.vip_group;
  if (!g || !g.number) {
    if (type === 'vip') {
      showToast('会员群尚未配置，请联系管理员');
      return;
    }
    return;
  }
  var modal = document.getElementById('groupModal');
  var avatarUrl = g.avatar || ('https://p.qlogo.cn/gh/' + g.number + '/' + g.number + '/100/');
  document.getElementById('gmAvatar').src = avatarUrl;
  document.getElementById('gmAvatar').onerror = function() { this.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><rect width="60" height="60" fill="#e0e0e0"/><text x="30" y="36" text-anchor="middle" font-size="24">' + (type === 'qq' ? '🐧' : '👑') + '</text></svg>'); };
  document.getElementById('gmName').textContent = g.name || ('QQ群: ' + g.number);
  document.getElementById('gmNumber').textContent = '群号: ' + g.number;
  document.getElementById('gmDesc').textContent = g.description || '';
  var joinBtn = document.getElementById('gmJoinBtn');
  if (type === 'vip') {
    joinBtn.textContent = '联系管理员';
    joinBtn.onclick = function() {
      var textarea = document.createElement('textarea');
      textarea.value = g.number;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('管理员QQ号已复制，请添加好友后联系');
    };
  } else {
    joinBtn.textContent = '点击加入群聊';
    joinBtn.onclick = function() {
      if (g.invite_link) { window.open(g.invite_link, '_blank'); }
      else { var textarea = document.createElement('textarea'); textarea.value = g.number; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); document.body.removeChild(textarea); showToast('群号已复制到剪贴板'); }
    };
  }
  modal.classList.add('show');
}
function hideGroupModal() { document.getElementById('groupModal').classList.remove('show'); }
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:10000;transition:opacity 0.3s;pointer-events:none'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._timer); t._timer = setTimeout(function() { t.style.opacity = '0'; }, 2000);
}

<!-- 页面状态持久化：解决跳转浏览器后返回状态丢失问题 -->
<script>
// 保存页面状态到 localStorage
function savePageState() {
  var state = {
    searchQuery: document.getElementById("si").value.trim(),
    scrollY: window.scrollY,
    curSub: window.curSub,
    curDisk: window.curDisk,
    curDLib: window.curDLib,
    curRecent: window.curRecent,
    curPopular: window.curPopular
  };
  localStorage.setItem('v49_page_state', JSON.stringify(state));
}

// 从 localStorage 恢复页面状态
function restorePageState() {
  var savedState = localStorage.getItem('v49_page_state');
  if (!savedState) return;

  try {
    var state = JSON.parse(savedState);

    // 恢复搜索内容
    if (typeof state.searchQuery !== 'undefined') {
      document.getElementById("si").value = state.searchQuery;
    }

    // 恢复筛选状态
    if (typeof state.curSub !== 'undefined') window.curSub = state.curSub;
    if (typeof state.curDisk !== 'undefined') window.curDisk = state.curDisk;
    if (typeof state.curDLib !== 'undefined') window.curDLib = state.curDLib;
    if (typeof state.curRecent !== 'undefined') window.curRecent = state.curRecent;
    if (typeof state.curPopular !== 'undefined') window.curPopular = state.curPopular;

    // 恢复按钮高亮状态
    // 恢复子分类按钮高亮
    document.querySelectorAll("#sysBar .sfb").forEach(function(b) {
      var s = b.getAttribute("data-s");
      b.className = "sfb" + (s === window.curSub ? " act" : "");
    });
    // 恢复网盘按钮高亮
    document.querySelectorAll("#diskBar .sfb").forEach(function(b) {
      var d = b.getAttribute("data-d");
      b.className = "sfb" + (d === window.curDisk ? " act" : "");
    });
    // 更新库列表并恢复库按钮高亮
    updateLibBar();
    document.querySelectorAll("#diskLibBar .sfb").forEach(function(b) {
      var l = b.getAttribute("data-l");
      b.className = "sfb sfb-lib" + (l === window.curDLib ? " act" : "");
    });
    // 恢复最近更新按钮状态
    document.querySelectorAll("#recentBtn").forEach(function(b) {
      b.className = "sfb sfb-recent" + (window.curRecent ? " act" : "");
    });
    // 恢复热门按钮状态
    document.querySelectorAll("#popularBtn").forEach(function(b) {
      b.className = "sfb sfb-popular" + (window.curPopular ? " act" : "");
    });

    // 重新应用筛选
    reFilter();

    // 恢复滚动位置（延迟执行确保内容已渲染）
    setTimeout(function() {
      window.scrollTo(0, state.scrollY || 0);
    }, 100);

  } catch (e) {
    // 解析出错，清除无效状态
    localStorage.removeItem('v49_page_state');
  }
  // 恢复后清除状态，避免下次重新打开页面时恢复旧数据
  localStorage.removeItem('v49_page_state');
}

// 监听页面可见性变化
var _firstLoad = true;
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    // 页面隐藏（跳转浏览器、退后台）时保存状态
    savePageState();
  } else {
    // 首次加载（关闭 App 重开）不恢复状态，回到首页
    if (_firstLoad) {
      _firstLoad = false;
      localStorage.removeItem('v49_page_state');
      return;
    }
    // 页面重新可见（从浏览器返回）时恢复状态
    restorePageState();
  }
});
</script>
